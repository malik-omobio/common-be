spring.application.name=__APP_NAME__
spring.profiles.active=dev
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/__APP_NAME___db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6380

# JWT
jwt.secret=change-this-secret-key-to-at-least-32-characters-long
jwt.access-expires=900000
jwt.refresh-expires=604800000

# CORS (align with Vite admin portal default)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Public app endpoints (comma-separated). Starter already exposes /api/v1/health and auth routes.
app.security.excluded-paths=

# Seed admin (used when profile 'seed' is active)
seed.admin.email=admin@example.com
seed.admin.password=admin123
