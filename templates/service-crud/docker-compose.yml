services:
  postgres:
    image: postgres:16
    container_name: __APP_NAME__-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: __APP_NAME___db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: __APP_NAME__-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
