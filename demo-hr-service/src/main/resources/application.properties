spring.application.name=demo-hr-service
spring.profiles.active=dev

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/demo-hr-service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6380

# JWT
jwt.secret=change-this-secret-key-to-at-least-32-characters-long
jwt.access-expires=900000
jwt.refresh-expires=604800000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Public (unauthenticated) app endpoints, added to the starter's core exclusions
app.security.excluded-paths=/api/v1/web/employees,/api/v1/web/employees/**

# Seed admin (used when profile 'seed' is active)
seed.admin.email=admin@example.com
seed.admin.password=admin123
